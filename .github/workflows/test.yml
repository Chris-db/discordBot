name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24  # match the Pi (production), which runs Node 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
